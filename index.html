<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧊 Nova OS Universe</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a1a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
        .header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:60px 20px;text-align:center;border-bottom:2px solid #c084fc}
        .header h1{font-size:56px;color:#c084fc}
        .header p{font-size:22px;color:#a0aec0;margin-top:10px}
        .container{max-width:1100px;margin:0 auto;padding:40px 20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;margin-top:30px}
        .card{background:#1a1a2e;border:1px solid #2d3748;border-radius:16px;padding:28px;text-align:center}
        .card:hover{border-color:#c084fc;transform:translateY(-6px)}
        .card .icon{font-size:44px}
        .btn{display:inline-block;padding:14px 32px;background:#c084fc;color:#0a0a1a;font-weight:700;border-radius:30px;text-decoration:none}
        .btn:hover{background:#a855f7;transform:scale(1.04)}
        .footer{text-align:center;padding:30px 20px;border-top:1px solid #2d3748;color:#718096}
        .footer a{color:#c084fc}
    </style>
</head>
<body>
    <div class="header">
        <h1>🧊 Nova OS Universe</h1>
        <p>Операционная система будущего с AI-интеллектом</p>
        <a href="#" class="btn" style="margin-top:20px;">📥 Скачать ISO</a>
    </div>
    <div class="container">
        <div class="grid">
            <div class="card"><div class="icon">🧠</div><h3>AI-планировщик</h3><p>В ядре Linux 6.6</p></div>
            <div class="card"><div class="icon">🗂️</div><h3>NovaFS</h3><p>Файловая система с AI</p></div>
            <div class="card"><div class="icon">🤖</div><h3>Nova AI</h3><p>ИИ-брат с голосом</p></div>
        </div>
    </div>
    <div class="footer">
        <p>🧊 Nova OS Universe 1.0 · <a href="#">GitHub</a></p>
    </div>
</body>
</html>
